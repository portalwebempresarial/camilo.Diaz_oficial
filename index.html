
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camilo Díaz | Contrataciones y Reservas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ajuste fluido para la página */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased">

    <!-- SECCIÓN DE PORTADA (HERO) CON VIDEO DE IG -->
    <header class="pt-16 pb-12 flex flex-col items-center justify-center min-h-screen text-center px-4 relative">
        <!-- Fondo sutil para separar el Iframe del resto -->
        <div class="absolute inset-0 bg-gradient-to-b from-gray-800 to-gray-900 -z-10"></div>
        
        <!-- Iframe directo desde Instagram -->
        <div class="w-full max-w-md mb-8 flex justify-center bg-white rounded-lg overflow-hidden shadow-2xl">
            <iframe src="https://www.instagram.com/reel/DDIcHGpRu7M/embed" 
                    width="400" 
                    height="580" 
                    frameborder="0" 
                    scrolling="no" 
                    allowtransparency="true"
                    allow="autoplay; encrypted-media"
                    class="w-full max-w-full">
            </iframe>
        </div>

        <div class="z-10 max-w-3xl mx-auto mt-2">
            <h1 class="text-5xl md:text-6xl font-bold mb-4 tracking-tight text-white uppercase">Camilo Díaz</h1>
            <p class="text-xl md:text-2xl mb-8 text-gray-300 font-light">Música en vivo que hará de tu evento una experiencia inolvidable.</p>
            <a href="#reservas" class="inline-block bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-4 px-10 rounded-full text-lg transition duration-300 shadow-[0_0_15px_rgba(234,179,8,0.4)]">
                Cotizar y Reservar Ahora
            </a>
        </div>
    </header>

    <!-- SECCIÓN DE FORMULARIO DE RESERVAS -->
    <section id="reservas" class="py-20 bg-gray-900">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-12">
                <h2 class="text-3xl md:text-4xl font-bold text-white mb-4">Solicita tu Fecha</h2>
                <p class="text-gray-400">Completa el formulario para consultar disponibilidad y precios para tu evento.</p>
            </div>

            <div class="bg-gray-800 p-8 rounded-2xl shadow-xl border border-gray-700">
                <form id="reservaForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Nombre -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Nombre Completo</label>
                            <input type="text" id="nombre" required class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 placeholder-gray-500" placeholder="Ej. Juan Pérez">
                        </div>
                        <!-- Teléfono -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Teléfono / WhatsApp</label>
                            <input type="tel" id="telefono" required class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 placeholder-gray-500" placeholder="Ej. 3001234567">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Fecha del Evento -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Fecha del Evento</label>
                            <input type="date" id="fecha" required class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500" style="color-scheme: dark;">
                        </div>
                        <!-- Tipo de Evento -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Tipo de Evento</label>
                            <select id="tipoEvento" class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500">
                                <option value="Cumpleaños">Cumpleaños</option>
                                <option value="Boda">Boda</option>
                                <option value="Evento Corporativo">Evento Corporativo</option>
                                <option value="Concierto/Bar">Concierto / Bar</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                    </div>

                    <!-- Mensaje / Detalles -->
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Detalles del Evento (Ciudad, Lugar, Horas requeridas)</label>
                        <textarea id="detalles" rows="4" required class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 placeholder-gray-500" placeholder="Escribe aquí los detalles de tu evento..."></textarea>
                    </div>

                    <!-- Botón de Envío -->
                    <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-lg text-lg transition duration-300 flex justify-center items-center gap-2">
                        <!-- Icono de WhatsApp -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                        </svg>
                        Enviar Solicitud por WhatsApp
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-black py-8 border-t border-gray-800">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h3 class="text-xl font-bold text-white mb-4">Sígueme en Redes</h3>
            <div class="flex justify-center mb-6">
                <a href="https://www.instagram.com/c.d._oficial/?hl=es-la" target="_blank" class="text-gray-400 hover:text-pink-500 transition duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.917 3.917 0 0 0-1.417.923A3.927 3.927 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.7.01 5.555 0 5.827 0 8.001c0 2.172.01 2.444.048 3.297.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.555 15.99 5.827 16 8 16s2.444-.01 3.298-.048c.851-.04 1.434-.174 1.943-.372a3.916 3.916 0 0 0 1.416-.923c.445-.445.718-.891.923-1.417.197-.509.332-1.09.372-1.942C15.99 10.445 16 10.173 16 8s-.01-2.445-.048-3.299c-.04-.851-.175-1.433-.372-1.941a3.926 3.926 0 0 0-.923-1.417A3.911 3.911 0 0 0 13.24.42c-.51-.198-1.092-.333-1.943-.372C10.443.01 10.172 0 7.998 0h.003zm-.717 1.442h.718c2.136 0 2.389.007 3.232.046.78.036 1.204.166 1.486.275.373.145.64.319.92.599.28.28.453.546.598.92.11.281.24.705.275 1.485.039.843.047 1.096.047 3.231s-.008 2.389-.047 3.232c-.035.78-.166 1.203-.275 1.485a2.47 2.47 0 0 1-.599.919c-.28.28-.546.453-.92.598-.28.11-.704.24-1.485.276-.843.038-1.096.047-3.232.047s-2.39-.009-3.233-.047c-.78-.036-1.203-.166-1.485-.276a2.478 2.478 0 0 1-.92-.598 2.48 2.48 0 0 1-.6-.92c-.109-.281-.24-.705-.275-1.485-.038-.843-.046-1.096-.046-3.233 0-2.136.008-2.388.046-3.231.036-.78.166-1.204.276-1.486.145-.373.319-.64.599-.92.28-.28.546-.453.92-.598.282-.11.705-.24 1.485-.276.738-.034 1.024-.044 2.515-.045v.002zm4.988 1.328a.96.96 0 1 0 0 1.92.96.96 0 0 0 0-1.92zm-4.27 1.122a4.109 4.109 0 1 0 0 8.217 4.109 4.109 0 0 0 0-8.217zm0 1.441a2.667 2.667 0 1 1 0 5.334 2.667 2.667 0 0 1 0-5.334z"/>
                    </svg>
                </a>
            </div>
            <p class="text-gray-500 text-sm">&copy; 2026 Camilo Díaz. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- SCRIPT DE ENVÍO A WHATSAPP -->
    <script>
        document.getElementById('reservaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // ATENCIÓN: Cambia este número por el WhatsApp que recibirá las reservas (con indicativo, sin el +)
            const numeroWhatsApp = "573000000000"; 
            
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const fecha = document.getElementById('fecha').value;
            const tipoEvento = document.getElementById('tipoEvento').value;
            const detalles = document.getElementById('detalles').value;

            const mensaje = `¡Hola! Vengo de la landing page. Quiero cotizar a Camilo Díaz para un evento:%0A%0A` +
                            `*Nombre:* ${nombre}%0A` +
                            `*Teléfono:* ${telefono}%0A` +
                            `*Fecha del Evento:* ${fecha}%0A` +
                            `*Tipo de Evento:* ${tipoEvento}%0A` +
                            `*Detalles:* ${detalles}`;

            const url = `https://wa.me/${numeroWhatsApp}?text=${mensaje}`;
            window.open(url, '_blank');
        });
    </script>
</body>
</html>
